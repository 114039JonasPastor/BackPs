services:
  product-db:
    image: postgres:16
    environment:
      POSTGRES_DB: Ps
      POSTGRES_USER: jonas24
      POSTGRES_PASSWORD: PracticaSupervisada123
    ports: [ "5433:5432" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PRODUCT_DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 10