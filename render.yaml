services:
  # Base de datos PostgreSQL
  - type: pserv
    name: tuoficio-db
    plan: free

  # Backend Spring Boot
  - type: web
    name: tuoficio-backend
    env: docker
    dockerfilePath: ./App/Dockerfile
    dockerContext: ./App
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tuoficio-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: tuoficio-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tuoficio-db
          property: password
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx512m
      - key: JWT_SECRET
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_PUBLIC_KEY
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: SPRING_MAIL_HOST
        value: smtp.gmail.com
      - key: SPRING_MAIL_PORT
        value: 587
      - key: SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH
        value: true
      - key: SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE
        value: false
      - key: SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE
        value: true
      - key: STREAM_CHAT_API_KEY
        sync: false
      - key: STREAM_CHAT_API_SECRET
        sync: false
      - key: BACKEND_URL
        value: https://tuoficio-backend.onrender.com
      - key: FRONTEND_URL
        value: https://tuoficio-frontend.onrender.com
    healthCheckPath: /actuator/health
